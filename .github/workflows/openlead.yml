name: openlead
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST 수집 + 전체 스캔
    - cron: "0 23 * * 0"   # 매주 월 08:00 KST 발송
    - cron: "30 * * * *"   # 매시 30분: 봇에 온 신청 메시지 수거
  workflow_dispatch:
    inputs:
      job:
        description: collect(=filesync) | filesync | send | send-dry | probe | backfill | signups | test-email
        default: collect
      pages:
        description: backfill 페이지 예산 (기본 9000)
        default: "9000"

permissions:
  contents: read

concurrency:
  group: openlead-db      # DB 캐시를 동시에 두 작업이 건드리지 않게
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore db   # ponytail: 캐시가 비면 빈 DB로 시작 (주간 리스트는 하루 수집이면 복구됨)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: openlead-db-${{ github.run_id }}
          restore-keys: openlead-db-
      - name: decide job
        id: j
        run: |
          j="${{ github.event.inputs.job }}"
          if [ -z "$j" ]; then
            case "${{ github.event.schedule }}" in
              "0 23 * * 0") j=send ;;
              "30 * * * *") j=signups ;;
              *)            j=collect ;;
            esac
          fi
          echo "job=$j" >> "$GITHUB_OUTPUT"
      - name: run
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CUSTOMERS_JSON: ${{ secrets.CUSTOMERS_JSON }}
          OPENLEAD_COLLECT: ${{ secrets.OPENLEAD_COLLECT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BACKFILL_PAGES: ${{ github.event.inputs.pages || '9000' }}
        run: |
          mkdir -p data
          case "${{ steps.j.outputs.job }}" in
            send-dry) python openlead.py send --dry ;;
            collect)  python openlead.py filesync ;;   # 서울 25개 구 인허가 파일 다운로드 → 신규·폐업 갱신 (API 불필요)
            *)        python openlead.py ${{ steps.j.outputs.job }} ;;
          esac
      - name: save db      # 실패해도 진행분 보존
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: openlead-db-${{ github.run_id }}
