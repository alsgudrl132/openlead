<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가게 전화번호 찾기 — 오픈리드</title>
<link rel="icon" href="favicon.png">
<!-- ponytail: 프로토타입 스타일. 디자인은 시안 확정 후 교체 -->
<style>
  body{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;margin:0;padding:16px;max-width:640px;margin:auto;color:#222}
  form{display:flex;gap:8px}
  input{flex:1;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:6px}
  button{font-size:16px;padding:10px 14px;border:0;border-radius:6px;background:#222;color:#fff}
  ul{list-style:none;padding:0}
  li{padding:12px 0;border-bottom:1px solid #eee}
  .name{font-weight:600}
  .addr{color:#666;font-size:14px}
  .tel{font-size:18px;margin-top:4px}
  .tel a{color:#0a58ca;text-decoration:none}
  .muted{color:#888;font-size:14px}
  .src{margin-top:24px;font-size:12px;color:#999}
  .hint{font-size:13px;color:#666;margin:8px 0 0}
  li.dim{opacity:.5}
  .tag{font-size:12px;padding:2px 6px;border-radius:4px;background:#e6f4ea;color:#1e7e34;margin-left:6px}
  .tag.no{background:#f3f3f3;color:#888}
</style>
</head>
<body>
<h1 style="font-size:20px;display:flex;align-items:center;gap:8px"><img src="mark.svg" alt="" style="width:24px;height:24px">가게 전화번호 찾기</h1>
<form id="f">
  <input id="q" placeholder="상호 + 동 (예: 옥된장 역삼동)" autofocus>
  <button>검색</button>
</form>
<p id="hint" class="hint"></p>
<p id="msg" class="muted"></p>
<ul id="out"></ul>
<p class="src">검색 결과 제공: 카카오 (실시간 조회, 저장하지 않음)</p>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=94fbd521b71e5192f9c8c60c067472f9&libraries=services&autoload=false"></script>
<script>
(function () {
  var q = document.getElementById('q'), out = document.getElementById('out'), msg = document.getElementById('msg');
  var params = new URLSearchParams(location.search);
  if (params.get('q')) q.value = params.get('q');
  var want = (params.get('a') || '').trim();            // 인허가 데이터의 도로명주소(건물까지)
  var closed = params.get('t') === 'c';                  // 폐업 신고 가게인지 (문구 분기)
  var knownTel = (params.get('tel') || '').trim();        // 인허가 자료에 있는 전화번호
  if (want && !knownTel) document.getElementById('hint').textContent = '찾는 주소: ' + want;
  if (knownTel) document.getElementById('hint').innerHTML = (want ? '찾는 주소: ' + esc(want) + '<br>' : '')
    + '<b>신고 자료 전화번호: <a href="tel:' + esc(knownTel) + '">' + esc(knownTel) + '</a></b> (아래는 지도 등록 정보)';
  function norm(s) { return String(s || '').replace(/^(서울특별시|서울|부산광역시|부산|경기도|경기)\s*/, '').replace(/\s+/g, ' ').trim(); }
  function sameAddr(p) {
    if (!want) return null;
    var w = norm(want), r = norm(p.road_address_name);
    return r && (r.indexOf(w) === 0 || w.indexOf(r) === 0);
  }

  function naver(s) { return 'https://map.naver.com/p/search/' + encodeURIComponent(s); }

  function none(query) {
    out.innerHTML = '';
    if (knownTel) { msg.innerHTML = '지도에는 등록 정보가 없습니다. 위의 신고 자료 번호를 쓰세요. <a href="' + naver(want || query) + '" target="_blank">네이버 지도에서 주소 보기</a>'; return; }
    msg.innerHTML = '<b>확인된 전화번호가 없습니다.</b> '+ (closed ? '폐업 뒤 지도에서 내려간 것으로 보입니다. ' : '아직 지도에 등록되지 않았습니다. ')
      + '주소로 찾아가거나 건너뛰세요. <a href="' + naver(want || query) + '" target="_blank">네이버 지도에서 주소 보기</a>';
  }
  function item(p, tag, dim) {
    var li = document.createElement('li');
    if (dim) li.className = 'dim';
    li.innerHTML = '<div class="name">' + esc(p.place_name) + tag + ' <span class="muted">' + esc((p.category_name || '').split('>').pop().trim()) + '</span></div>'
      + '<div class="addr">' + esc(p.road_address_name || p.address_name) + '</div>'
      + '<div class="tel">' + (p.phone ? '<a href="tel:' + esc(p.phone) + '">' + esc(p.phone) + '</a>' : '<span class="muted">전화번호 미등록</span>') + '</div>'
      + '<div class="muted"><a href="' + esc(p.place_url) + '" target="_blank">카카오맵</a> · <a href="' + naver(p.place_name) + '" target="_blank">네이버 지도</a></div>';
    return li;
  }
  function render(items, query) {
    out.innerHTML = '';
    if (!items.length && !want) {
      msg.innerHTML = (closed
        ? '카카오맵에서 찾지 못했습니다. 폐업 뒤 지도에서 내려갔거나 다른 이름으로 등록돼 있을 수 있습니다. '
        : '카카오맵에 아직 등록되지 않은 가게입니다. 개업 2~3주 뒤 다시 조회해 보세요. ')
        + '<a href="' + naver(query) + '" target="_blank">네이버 지도에서 찾기</a>'
        + (want ? ' · <a href="' + naver(want) + '" target="_blank">주소로 보기</a>' : '');
      return;
    }
    items = items.map(function (p) { p._ok = sameAddr(p); return p; });
    if (want) items = items.filter(function (p) { return p._ok === true; });   // 주소가 맞는 것만. 비슷한 상호는 보여주지 않는다
    if (!items.length) { none(query); return; }
    msg.textContent = want ? '주소 일치 ' + items.length + '건' : items.length + '건';
    items.forEach(function (p) {
      var tag = p._ok === true ? '<span class="tag">주소 일치</span>' : (p._ok === false ? '<span class="tag no">유사 상호</span>' : '');
      out.appendChild(item(p, tag, p._ok === false));
    });
  }
  function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // 긴 상호는 카카오가 못 찾는다 → 단계적으로 줄여가며 재시도
  function variants(query) {
    var parts = query.split(/\s+/), dong = '', name = query;
    if (parts.length > 1 && /(동|가|읍|면)$/.test(parts[parts.length - 1])) { dong = parts.pop(); name = parts.join(' '); }
    var core = name.replace(/\([^)]*\)/g, ' ').replace(/^(주식회사|유한회사|㈜)\s*/, '')   // 괄호·법인 표기 제거
                   .replace(/\s*(강남|서초|서울|본점|\S*점|\S*호점)$/u, '')      // 지점 표기 제거
                   .replace(/\s+/g, ' ').trim();
    var first2 = core.split(' ').slice(0, 2).join(' ');
    var list = [query, core + (dong ? ' ' + dong : ''), core, first2 + (dong ? ' ' + dong : ''), first2, name];
    return list.filter(function (v, i, a) { return v && v.trim() && a.indexOf(v) === i; });
  }
  function search() {
    var query = q.value.trim();
    if (!query) return;
    msg.textContent = '검색 중…';
    if (!window.kakao || !kakao.maps) { msg.innerHTML = '검색 서비스를 불러오지 못했습니다. <a href="' + naver(query) + '" target="_blank">네이버 지도에서 찾기</a>'; return; }
    kakao.maps.load(function () {
      var ps = new kakao.maps.services.Places(), tries = variants(query), i = 0;
      (function next() {
        if (i >= tries.length) { none(query); return; }
        var qv = tries[i++];
        ps.keywordSearch(qv, function (data, status) {
          var ok = status === kakao.maps.services.Status.OK ? data : [];
          if (want) { var hit = ok.filter(function (p) { return sameAddr(p); }); if (hit.length) { render(ok, qv); return; } }
          else if (ok.length) { render(ok, qv); return; }
          if (i >= tries.length) { if (want) none(query); else render(ok, qv); return; }   // 상호+주소 일치 없음 → 없음
          next();
        }, { size: 10 });
      })();
    });
  }
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); search(); });
  if (q.value) search();
})();
</script>
</body>
</html>
